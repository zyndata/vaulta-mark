<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VaultaMark</title>
    <script type="module" src="./popup.ts"></script>
  </head>
  <body class="vm-popup">
    <!-- The right-hand slot belongs to whichever screen is up: the unlocked vault puts "Add this
         page" there, and every other screen leaves it empty. The version number used to sit here
         and now lives in the settings screen, which is a line of the bookmark list back. -->
    <header class="vm-header">
      <h1 class="vm-wordmark">VaultaMark</h1>
      <div class="vm-header-action" id="vm-header-action"></div>
    </header>
    <!-- Everything below the wordmark is built by popup.ts: which screen belongs here depends on
         whether a vault exists and whether it is unlocked, and neither is known until the service
         worker answers. -->
    <main id="vm-root"></main>
  </body>
</html>
