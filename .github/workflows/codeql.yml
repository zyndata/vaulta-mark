name: codeql

# Static analysis for JavaScript/TypeScript.
#
# Code scanning is free on public repositories; on a private one it requires GitHub Advanced
# Security. This repository is private (PLAN.md D36), so the analysis itself runs fine but the
# upload step fails: "Code scanning is not enabled for this repository."
#
# Hence weekly only, not on every push. A workflow that fails on every single push teaches you to
# ignore a red check — which costs more than this analysis is worth while its results have nowhere
# to be stored. The file stays (docs/BRANCH_PROTECTION.md §5) so that scanning starts working the
# day the repository is made public; restoring the `push` and `pull_request` triggers is on the
# checklist in BRANCH_PROTECTION.md §7.
on:
  schedule:
    # Monday 04:17 UTC. The only automatic trigger while the repository is private.
    - cron: '17 4 * * 1'
  # So a run can still be started by hand — e.g. right after code scanning becomes available.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: '/language:javascript-typescript'
