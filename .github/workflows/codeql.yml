name: codeql

# Static analysis for JavaScript/TypeScript.
#
# Code scanning is free on public repositories and needs GitHub Advanced Security on a private one.
# While this repository was private (PLAN.md D36) the analysis ran fine but the upload step failed
# on every push with "Code scanning is not enabled for this repository" — so the push and
# pull_request triggers were removed and only the weekly run was kept. A workflow that fails on
# every single push teaches you to ignore a red check, which costs more than the analysis is worth
# while its results have nowhere to be stored.
#
# The repository was made public on 2026-08-15 and the upload works, so those triggers are back:
# analysing each change as it lands is the entire point, and weekly alone would let a bad commit sit
# for six days. The weekly run stays as well — it re-analyses unchanged code against updated CodeQL
# queries, which is the half that pushes cannot cover.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    # Monday 04:17 UTC — catches new queries against code that has not changed.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
