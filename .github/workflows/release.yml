name: release

# A tag push builds and publishes a GitHub Release. It never reaches the Chrome Web Store: that
# takes a deliberate workflow_dispatch with `publish: true`, and then a human approving the
# `chrome-web-store` environment. Three gates, described in docs/RELEASE.md §7.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.2.3)'
        required: true
      publish:
        description: 'Upload to the Chrome Web Store'
        type: boolean
        default: false
      auto_publish:
        description: 'Also submit for review (otherwise upload as a draft)'
        type: boolean
        default: false

permissions:
  contents: read

# Two runs of the same release would race on one GitHub Release and one Store item. Never cancel
# in progress: a half-finished upload is worse than a queued one.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Every `uses:` is pinned to a full commit SHA with the tag as a trailing comment — a tag is
# mutable, and this is the workflow whose publish job holds a standing credential over the Store
# listing. Dependabot maintains SHA pins and rewrites the comment.
#
# `${{ … }}` never appears inside a `run:` block here. `inputs.tag` is free text typed into the
# dispatch form, and expression interpolation happens *before* the shell sees the script, so a
# value like `v1.0.0"; curl …` would become shell code. Passing it through `env:` makes the shell
# treat it as data.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the provenance attestation below: `id-token` mints the OIDC token that proves which
      # workflow run signed, `attestations` writes the result.
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history, which also brings every branch ref — `origin/main` has to exist locally
          # for the ancestry check below to mean anything.
          fetch-depth: 0
          # Nothing here talks to git over the network after the checkout, and the release upload
          # authenticates through the action's own token rather than `.git/config`.
          persist-credentials: false

      # `main` is what is reviewed, merged and shipped (RELEASE §1). A tag on `dev` would build
      # green and release code that never passed through a release merge.
      - name: Tag must be on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not an ancestor of main." \
                 "Releases are tagged on main after a --no-ff merge from dev (RELEASE §4)."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Before the suite, not after: a mistyped tag should cost thirty seconds rather than the
      # full run. The manifest leg of the same check runs again after the build, below.
      - name: Version must match the tag
        run: node scripts/check-version-sync.mjs "$TAG"

      # The notes are extracted here too, for the same reason — an unfinalized CHANGELOG section
      # is a mistake to catch before the build, not after the Release exists.
      - name: Release notes
        # Redirect and then `cat`, rather than piping through `tee`: the default shell is `bash -e`
        # without `pipefail`, so a pipeline would report tee's exit code and swallow the refusal.
        run: |
          mkdir -p release
          node scripts/release-notes.mjs "$TAG" > release/NOTES.md
          cat release/NOTES.md

      - run: npm run lint
      - run: npm run type-check
      # Already runs with coverage; the thresholds gate here as they do in ci.
      - run: npm run test
      - run: npm run build
      - run: npm run verify:invariants
      - run: node scripts/check-budgets.mjs --report release/bundle-report.md

      - name: The built manifest must match too
        run: node scripts/check-version-sync.mjs "$TAG" --built

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - run: npm run zip

      # The zip writer is deterministic (fixed timestamps, sorted entries), so this hash is one a
      # user can reproduce from the tagged source — README "Install" says exactly how far that
      # promise goes.
      - name: Checksums
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      # The checksum says two files are the same file. This says *where the file came from*: the
      # attestation binds the zip's digest to this workflow run, this commit and this builder, and
      # a user checks it with `gh attestation verify --owner zyndata release/vaulta-mark-1.0.0.zip`.
      # Free on public repositories, and the two claims answer different questions — keep both.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release/NOTES.md
          files: |
            release/*.zip
            release/SHA256SUMS
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: release/
          retention-days: 90

  publish:
    needs: build
    # Never on a bare tag push: `inputs` is empty there, so this is false without having to say so.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    # Configured with required reviewers, so a publish waits for a human (RELEASE §6.5). The four
    # CWS_* secrets are *environment* secrets on it, not repository secrets, so they exist only
    # for a run that passed the review gate.
    environment: chrome-web-store
    env:
      TAG: ${{ inputs.tag }}
      AUTO_PUBLISH: ${{ inputs.auto_publish }}
    steps:
      # A pre-release is a GitHub artifact only. Chrome sorts `1.2.0.1` *below* `1.2.0`, so an
      # uploaded rc would make the real 1.2.0 unpublishable — see ARCHITECTURE §2. Refuse it here
      # rather than trusting whoever filled in the dispatch form.
      - name: Pre-releases are never published
        if: ${{ contains(inputs.tag, '-') }}
        run: |
          echo "::error::$TAG is a pre-release. Chrome sorts its mapped version below" \
               "the final one, so uploading it would block the real release (ARCHITECTURE §2)."
          exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: release/

      # Exact version, not `@3`: this runs in the one job whose environment holds the Store
      # credentials, so a compromised patch release of the CLI or of anything it depends on would
      # execute with them in `process.env`. `--ignore-scripts` denies that tree an install hook.
      # The pin is bumped deliberately, after reading what changed.
      - run: npm install -g --ignore-scripts chrome-webstore-upload-cli@3.5.0

      # Uploads a draft unless `auto_publish` was also ticked. Leave it off until several releases
      # have gone through cleanly — the Store has no rollback (RELEASE §10).
      - name: Upload to the Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ "$AUTO_PUBLISH" = "true" ]; then
            chrome-webstore-upload upload --source release/vaulta-mark-*.zip --auto-publish
          else
            chrome-webstore-upload upload --source release/vaulta-mark-*.zip
          fi
